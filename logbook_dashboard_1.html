<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logbook · ATP Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080d18;
  --surface: #0f1929;
  --surface-2: #162032;
  --surface-3: #1d2a40;
  --accent: #3b82f6;
  --accent-glow: rgba(59,130,246,0.15);
  --green: #10b981;
  --green-glow: rgba(16,185,129,0.12);
  --amber: #f59e0b;
  --red: #ef4444;
  --text: #e2e8f0;
  --text-2: #94a3b8;
  --text-3: #475569;
  --border: rgba(255,255,255,0.07);
  --border-2: rgba(255,255,255,0.12);
  --radius: 10px;
  --radius-lg: 16px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── TOPBAR ── */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 52px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-mark {
  width: 28px; height: 28px;
  border: 1.5px solid var(--accent);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: -0.5px;
}
.topbar-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.01em;
}
.topbar-pilot {
  font-size: 12px;
  color: var(--text-2);
}

/* upload button */
.upload-btn {
  display: flex;
  align-items: center;
  gap: 7px;
  background: var(--surface-3);
  border: 1px solid var(--border-2);
  border-radius: 7px;
  padding: 6px 14px;
  color: var(--text);
  font-size: 13px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.upload-btn:hover { border-color: var(--accent); background: var(--accent-glow); color: #fff; }
.upload-btn svg { flex-shrink: 0; }
#fileInput { display: none; }

/* ── LAYOUT ── */
.main { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }

/* ── UPLOAD EMPTY STATE ── */
#emptyState {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: calc(100vh - 52px);
  text-align: center;
  gap: 16px;
}
.empty-drop {
  width: 380px;
  max-width: 90vw;
  border: 1.5px dashed var(--border-2);
  border-radius: var(--radius-lg);
  padding: 48px 32px;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.empty-drop:hover, .empty-drop.drag-over {
  border-color: var(--accent);
  background: var(--accent-glow);
}
.empty-icon {
  font-size: 40px;
  margin-bottom: 12px;
  opacity: 0.6;
}
.empty-h { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.empty-sub { font-size: 13px; color: var(--text-2); line-height: 1.6; }
.empty-tag {
  display: inline-block;
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: 5px;
  padding: 2px 8px;
  font-size: 11px;
  font-family: monospace;
  color: var(--accent);
  margin-top: 12px;
}

/* ── DASHBOARD ── */
#dashboard { display: none; }

/* ── STATS ROW ── */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.stat-tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.stat-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
.stat-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; }
.stat-sub { font-size: 11px; color: var(--text-2); margin-top: 4px; }
.stat-tile.accent-green .stat-val { color: var(--green); }
.stat-tile.accent-blue .stat-val { color: var(--accent); }

/* ── TWO-COL LAYOUT ── */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 16px;
  margin-bottom: 16px;
}
@media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
}
.card-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  margin-bottom: 18px;
}

/* ── CHART ── */
.chart-wrap { position: relative; width: 100%; height: 220px; }

/* ── ATP REQS ── */
.atp-list { display: flex; flex-direction: column; gap: 12px; }

.atp-req {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 8px;
  align-items: center;
}
.atp-name {
  font-size: 13px;
  color: var(--text);
  font-weight: 500;
  grid-column: 1;
}
.atp-badge {
  grid-column: 2;
  grid-row: 1 / 3;
  align-self: center;
  font-size: 10px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 100px;
  white-space: nowrap;
}
.atp-badge.met {
  background: var(--green-glow);
  color: var(--green);
  border: 1px solid rgba(16,185,129,0.25);
}
.atp-badge.pending {
  background: var(--accent-glow);
  color: var(--accent);
  border: 1px solid rgba(59,130,246,0.25);
}
.atp-track-wrap { grid-column: 1; }
.atp-track {
  height: 5px;
  background: var(--surface-3);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 3px;
}
.atp-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s ease;
}
.atp-nums { font-size: 10px; color: var(--text-3); font-variant-numeric: tabular-nums; }

/* ── GAUGES (circular progress) ── */
.gauge-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
.gauge-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.gauge-wrap { position: relative; width: 130px; height: 130px; }
.gauge-svg { width: 130px; height: 130px; transform: rotate(-90deg); }
.gauge-track { fill: none; stroke: var(--surface-3); stroke-width: 9; }
.gauge-fill { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.8s cubic-bezier(0.4,0,0.2,1); }
.gauge-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  text-align: center;
}
.gauge-pct { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.gauge-pct-sign { font-size: 13px; }
.gauge-done { font-size: 10px; color: var(--text-3); margin-top: 2px; }
.gauge-title { font-size: 13px; font-weight: 600; color: var(--text); text-align: center; }
.gauge-detail { font-size: 11px; color: var(--text-2); text-align: center; line-height: 1.5; }

/* ── BREAKDOWN TABLE ── */
.breakdown-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.breakdown-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
}
.breakdown-label { font-size: 12px; color: var(--text-2); }
.breakdown-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); }

/* ── PACE SECTION ── */
.pace-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

/* ── AIRCRAFT TABLE ── */
.aircraft-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.aircraft-table th { text-align: left; padding: 0 8px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-3); border-bottom: 1px solid var(--border); }
.aircraft-table td { padding: 8px; border-bottom: 1px solid var(--border); color: var(--text); }
.aircraft-table tr:last-child td { border-bottom: none; }
.aircraft-table td:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.ac-bar { display: inline-block; height: 3px; background: var(--accent); border-radius: 2px; vertical-align: middle; margin-left: 8px; opacity: 0.5; }

/* ── SECTION HEADER ── */
.section-hdr {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
  margin: 24px 0 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* ── 1500 PROGRESS BAR ── */
.big-progress {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 22px;
  margin-bottom: 16px;
}
.bp-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 12px;
}
.bp-title { font-size: 14px; font-weight: 600; }
.bp-sub { font-size: 12px; color: var(--text-2); }
.bp-track {
  height: 12px;
  background: var(--surface-3);
  border-radius: 6px;
  overflow: visible;
  position: relative;
  margin-bottom: 8px;
}
.bp-fill {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--accent), #60a5fa);
  transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  position: relative;
}
.bp-fill::after {
  content: '';
  position: absolute;
  right: -1px; top: -2px;
  width: 16px; height: 16px;
  background: #93c5fd;
  border-radius: 50%;
  box-shadow: 0 0 8px rgba(147,197,253,0.6);
}
.bp-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); }
.bp-labels strong { color: var(--text-2); }

/* ── YEAR PROJ ── */
.proj-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 3px; }

.months-60 { font-size: 11px; color: var(--green); font-weight: 600; }
</style>
</head>
<body>

<nav class="topbar">
  <div class="topbar-left">
    <div class="logo-mark">ATP</div>
    <div>
      <div class="topbar-title">Logbook Dashboard</div>
    </div>
  </div>
  <label class="upload-btn" for="fileInput">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    <span id="uploadLabel">Upload logbook CSV</span>
  </label>
  <input type="file" id="fileInput" accept=".csv,.txt">
</nav>

<!-- EMPTY STATE -->
<div id="emptyState">
  <label class="empty-drop" for="fileInput" id="dropZone">
    <div class="empty-icon">✈</div>
    <div class="empty-h">Drop your LogTen export here</div>
    <div class="empty-sub">Export from LogTen → Reports → Export Flights (Tab)<br>then upload the file to see your stats.</div>
    <div class="empty-tag">Export Flights (Tab) .csv</div>
  </label>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="main">

    <!-- 1500 PROGRESS -->
    <div class="big-progress">
      <div class="bp-header">
        <div class="bp-title">Road to 1,500 hours</div>

      </div>
      <div class="bp-labels">
        <span>0</span>
        <strong id="bigProgressCurrent"></strong>
        <span>1,500 hrs</span>
      </div>
    </div>

    <!-- TOP STATS -->
    <div class="stats-row" id="statsRow"></div>

    <!-- GAUGES (in-progress ATP items) -->
    <div class="gauge-row">
      <div class="gauge-card">
        <div class="gauge-wrap">
          <svg class="gauge-svg" viewBox="0 0 130 130">
            <circle class="gauge-track" cx="65" cy="65" r="55"/>
            <circle class="gauge-fill" id="gauge1Fill" cx="65" cy="65" r="55" stroke="#3b82f6" stroke-dasharray="345.4" stroke-dashoffset="345.4"/>
          </svg>
          <div class="gauge-center">
            <div class="gauge-pct" id="gauge1Pct" style="color:#3b82f6">0<span class="gauge-pct-sign">%</span></div>
            <div class="gauge-done" id="gauge1Done"></div>
          </div>
        </div>
        <div class="gauge-title">Total flight time</div>
        <div class="gauge-detail" id="gauge1Detail"></div>
      </div>
      <div class="gauge-card">
        <div class="gauge-wrap">
          <svg class="gauge-svg" viewBox="0 0 130 130">
            <circle class="gauge-track" cx="65" cy="65" r="55"/>
            <circle class="gauge-fill" id="gauge2Fill" cx="65" cy="65" r="55" stroke="#f59e0b" stroke-dasharray="345.4" stroke-dashoffset="345.4"/>
          </svg>
          <div class="gauge-center">
            <div class="gauge-pct" id="gauge2Pct" style="color:#f59e0b">0<span class="gauge-pct-sign">%</span></div>
            <div class="gauge-done" id="gauge2Done"></div>
          </div>
        </div>
        <div class="gauge-title">Cross-country time</div>
        <div class="gauge-detail" id="gauge2Detail"></div>
      </div>
    </div>

    <!-- MONTHLY CHART + ATP LIST -->
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Monthly hours</div>
        <div style="font-size:11px; color:var(--text-3); margin:-10px 0 14px; display:flex; gap:16px; flex-wrap:wrap;">
          <span style="display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:10px;height:10px;background:#3b82f6;border-radius:2px;"></span>Below 60 hrs</span>
          <span style="display:flex;align-items:center;gap:5px;"><span style="display:inline-block;width:10px;height:10px;background:#10b981;border-radius:2px;"></span>60+ hrs (on pace)</span>
        </div>
        <div class="chart-wrap">
          <canvas id="monthlyChart" role="img" aria-label="Monthly flight hours bar chart"></canvas>
        </div>

  </div>

<script>
const CIRC = 2 * Math.PI * 55;

function safeFloat(v) {
  const n = parseFloat((v || '').trim());
  return isNaN(n) ? 0 : n;
}
function safeInt(v) {
  const n = parseInt((v || '').trim());
  return isNaN(n) ? 0 : n;
}
function fmt(n, dec=1) {
  return Number(n).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec});
}
function pct(have, need) {
  return Math.min(100, (have / need) * 100);
}

function parseCSV(text) {
  // Proper tab-delimited parser that handles quoted fields with embedded newlines
  // (LogTen wraps some remarks in quotes containing \n which breaks naive split('\n'))
  function parseRows(str, delim) {
    const rows = [];
    let cur = [];
    let field = '';
    let inQuote = false;
    for (let i = 0; i < str.length; i++) {
      const ch = str[i];
      if (inQuote) {
        if (ch === '"') {
          if (str[i+1] === '"') { field += '"'; i++; }
          else inQuote = false;
        } else {
          field += ch;
        }
      } else {
        if (ch === '"') {
          inQuote = true;
        } else if (ch === delim) {
          cur.push(field); field = '';
        } else if (ch === '\n' || (ch === '\r' && str[i+1] === '\n')) {
          if (ch === '\r') i++;
          cur.push(field); field = '';
          if (cur.some(c => c.trim())) rows.push(cur);
          cur = [];
        } else {
          field += ch;
        }
      }
    }
    if (field || cur.length) { cur.push(field); if (cur.some(c => c.trim())) rows.push(cur); }
    return rows;
  }

  const allRows = parseRows(text, '\t');
  if (allRows.length < 2) return [];
  const headers = allRows[0].map(h => h.trim());
  const rows = [];
  for (let i = 1; i < allRows.length; i++) {
    const vals = allRows[i];
    const row = {};
    headers.forEach((h, idx) => { row[h] = (vals[idx] || '').trim(); });
    rows.push(row);
  }
  return rows;
}

function computeStats(rows) {
  const monthly = {};
  const yearly = {};
  const aircraft = {};
  let s = {
    total:0, pic:0, night:0, actual_ifr:0, sim_ifr:0,
    xc:0, solo:0, dual_given:0, dual_received:0,
    asel:0, amel:0, day_land:0, night_land:0,
    pic_night:0, pic_xc:0
  };

  rows.forEach(row => {
    const date = (row['flight_flightDate']||'').trim();
    if (!date || date.length < 7) return;
    const tt = safeFloat(row['flight_totalTime']);
    if (!tt) return;

    const [yr, mo] = date.split('-');
    const key = `${yr}-${mo}`;
    monthly[key] = (monthly[key]||0) + tt;
    yearly[yr] = (yearly[yr]||0) + tt;

    const ftype = (row['flight_type']||'').trim();
    const acClass = (row['aircraftType_selectedAircraftClass']||'').trim();
    const acType = (row['aircraftType_type']||'').trim();
    const isSim = ftype === '3';
    const isMulti = acClass.includes('Multi') || acType === 'PA44';
    const acID = (row['aircraft_aircraftID']||'').trim();

    s.total += tt;
    s.pic += safeFloat(row['flight_pic']);
    s.night += safeFloat(row['flight_night']);
    s.actual_ifr += safeFloat(row['flight_actualInstrument']);
    s.sim_ifr += safeFloat(row['flight_simulatedInstrument']);
    s.xc += safeFloat(row['flight_crossCountry']);
    s.solo += safeFloat(row['flight_solo']);
    s.dual_given += safeFloat(row['flight_dualGiven']);
    s.dual_received += safeFloat(row['flight_dualReceived']);
    s.day_land += safeInt(row['flight_dayLandings']);
    s.night_land += safeInt(row['flight_nightLandings']);
    s.pic_night += safeFloat(row['flight_picNight']);

    const pic = safeFloat(row['flight_pic']);
    const xc = safeFloat(row['flight_crossCountry']);
    s.pic_xc += Math.min(pic, xc);

    if (!isSim) {
      if (isMulti) s.amel += tt;
      else s.asel += tt;
      if (acID) aircraft[acID] = (aircraft[acID]||0) + tt;
    }
  });

  s.total_ifr = s.actual_ifr + s.sim_ifr;

  // Monthly arrays sorted
  const monthKeys = Object.keys(monthly).sort();
  const monthVals = monthKeys.map(k => monthly[k]);

  // Pace
  const last12Keys = monthKeys.slice(-12);
  const last12Vals = last12Keys.map(k => monthly[k]);
  const avg12 = last12Vals.length ? last12Vals.reduce((a,b)=>a+b,0)/last12Vals.length : 0;
  const avgAll = monthVals.length ? monthVals.reduce((a,b)=>a+b,0)/monthVals.length : 0;
  const bestVal = Math.max(...monthVals);
  const bestKey = monthKeys[monthVals.indexOf(bestVal)];

  // Projection: months to go in 2026
  const now = new Date();
  const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const endOfYear = new Date(now.getFullYear(), 11, 31);
  const monthsLeft = ((endOfYear.getFullYear() - now.getFullYear()) * 12) + (endOfYear.getMonth() - now.getMonth()) + 1;
  const projTotal = s.total + (avg12 * (monthsLeft - 0.5));

  return { s, monthly, monthKeys, monthVals, yearly, aircraft, avg12, avgAll, bestVal, bestKey, monthsLeft, projTotal };
}

let monthlyChartInst = null;
let yearlyChartInst = null;

function renderDashboard(stats) {
  const { s, monthKeys, monthVals, yearly, aircraft, avg12, avgAll, bestVal, bestKey, monthsLeft, projTotal } = stats;

  // Show dashboard
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';

  // BIG PROGRESS
  const totalPct = pct(s.total, 1500);
  document.getElementById('bigProgressFill').style.width = totalPct.toFixed(1) + '%';
  document.getElementById('bigProgressCurrent').textContent = fmt(s.total) + ' hrs';
  const toGo = Math.max(0, 1500 - s.total);
  const etaMonths = avg12 > 0 ? Math.ceil(toGo / avg12) : null;
  document.getElementById('bigProgressSub').textContent =
    toGo > 0
      ? `${fmt(toGo,1)} hrs to go · ~${etaMonths} months at current pace`
      : 'ATP total time requirement met!';

  // TOP STATS
  const statsData = [
    { label: 'Total time', val: fmt(s.total), sub: 'hours', cls: 'accent-blue' },
    { label: 'PIC', val: fmt(s.pic), sub: `${((s.pic/s.total)*100).toFixed(0)}% of total`, cls: '' },
    { label: 'CFI dual given', val: fmt(s.dual_given), sub: `${((s.dual_given/s.total)*100).toFixed(0)}% of total`, cls: '' },
    { label: 'Night', val: fmt(s.night), sub: `${s.night_land} night landings`, cls: '' },
    { label: 'Instrument', val: fmt(s.total_ifr), sub: `${fmt(s.actual_ifr)} actual · ${fmt(s.sim_ifr)} sim`, cls: '' },
    { label: 'Cross-country', val: fmt(s.xc), sub: `500 hr req`, cls: '' },
    { label: 'Total landings', val: (s.day_land + s.night_land).toLocaleString(), sub: `${s.day_land} day · ${s.night_land} night`, cls: '' },
    { label: 'AMEL', val: fmt(s.amel), sub: 'multi-engine land', cls: '' },
  ];
  const statsRow = document.getElementById('statsRow');
  statsRow.innerHTML = statsData.map(d =>
    `<div class="stat-tile ${d.cls}">
      <div class="stat-label">${d.label}</div>
      <div class="stat-val">${d.val}</div>
      <div class="stat-sub">${d.sub}</div>
    </div>`
  ).join('');

  // GAUGES
  function setGauge(fillId, pctId, doneId, detailId, have, need, color) {
    const p = Math.min(100, (have/need)*100);
    const offset = CIRC * (1 - p/100);
    document.getElementById(fillId).style.strokeDashoffset = offset;
    document.getElementById(fillId).setAttribute('stroke', color);
    document.getElementById(pctId).style.color = color;
    document.getElementById(pctId).innerHTML = Math.round(p) + '<span class="gauge-pct-sign">%</span>';
    document.getElementById(doneId).textContent = fmt(have,1) + ' hrs';
    const toGo = Math.max(0, need - have);
    document.getElementById(detailId).textContent =
      toGo > 0
        ? `${fmt(toGo,1)} hrs to go · need ${fmt(need)} total`
        : `✓ ${fmt(have)} hrs · requirement met`;
  }
  setGauge('gauge1Fill','gauge1Pct','gauge1Done','gauge1Detail', s.total, 1500, '#3b82f6');
  setGauge('gauge2Fill','gauge2Pct','gauge2Done','gauge2Detail', s.xc, 500, '#f59e0b');

  // ATP LIST
  const atpReqs = [
    { name: 'Total flight time', have: s.total, need: 1500, unit: 'hrs' },
    { name: 'PIC time', have: s.pic, need: 250, unit: 'hrs' },
    { name: 'PIC cross-country', have: s.pic_xc, need: 100, unit: 'hrs' },
    { name: 'PIC night', have: s.pic_night, need: 75, unit: 'hrs' },
    { name: 'Total night time', have: s.night, need: 100, unit: 'hrs' },
    { name: 'Instrument (actual + sim)', have: s.total_ifr, need: 50, unit: 'hrs' },
    { name: 'Cross-country time', have: s.xc, need: 500, unit: 'hrs' },
    { name: 'Night landings (full-stop)', have: s.night_land, need: 20, unit: '' },
    { name: 'Flight training received', have: s.dual_received, need: 25, unit: 'hrs' },
  ];
  const atpList = document.getElementById('atpList');
  atpList.innerHTML = atpReqs.map(r => {
    const p = Math.min(100, (r.have/r.need)*100);
    const met = r.have >= r.need;
    const fillColor = met ? '#10b981' : (p > 60 ? '#f59e0b' : '#3b82f6');
    const badge = met
      ? '<span class="atp-badge met">✓ MET</span>'
      : `<span class="atp-badge pending">${fmt(r.need - r.have, r.unit===''?0:1)} to go</span>`;
    return `<div class="atp-req">
      <span class="atp-name">${r.name}</span>
      ${badge}
      <div class="atp-track-wrap">
        <div class="atp-track"><div class="atp-fill" style="width:${p.toFixed(1)}%;background:${fillColor}"></div></div>
        <div class="atp-nums">${r.unit ? fmt(r.have)+' '+r.unit : r.have.toLocaleString()} / ${r.unit ? r.need+' '+r.unit : r.need}</div>
      </div>
    </div>`;
  }).join('');

  // MONTHLY CHART
  const labels = monthKeys.map(k => {
    const [y, m] = k.split('-');
    const mn = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return mn[parseInt(m)] + " '" + y.slice(2);
  });
  const colors = monthVals.map(v => v >= 60 ? '#10b981' : '#3b82f6');

  if (monthlyChartInst) monthlyChartInst.destroy();
  monthlyChartInst = new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          data: monthVals,
          backgroundColor: colors,
          borderRadius: { topLeft: 3, topRight: 3 },
          borderSkipped: 'bottom',
          categoryPercentage: 0.85,
          barPercentage: 0.9
        },
        {
          type: 'line',
          data: new Array(labels.length).fill(60),
          borderColor: 'rgba(245,158,11,0.5)',
          borderWidth: 1.5,
          borderDash: [4,3],
          pointRadius: 0,
          fill: false,
          label: '60 hr target'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ctx.datasetIndex === 0
              ? ` ${ctx.parsed.y.toFixed(1)} hrs`
              : ' 60 hr target'
          }
        }
      },
      scales: {
        x: {
          ticks: { color: '#475569', font: { size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 18 },
          grid: { display: false },
          border: { color: 'rgba(255,255,255,0.07)' }
        },
        y: {
          ticks: { color: '#475569', font: { size: 11 }, callback: v => v + 'h' },
          grid: { color: 'rgba(255,255,255,0.05)' },
          border: { display: false },
          min: 0
        }
      }
    }
  });

  // BREAKDOWN
  const breakdown = [
    { label: 'ASEL', val: fmt(s.asel) + ' hrs' },
    { label: 'AMEL', val: fmt(s.amel) + ' hrs' },
    { label: 'PIC', val: fmt(s.pic) + ' hrs' },
    { label: 'Dual given (CFI)', val: fmt(s.dual_given) + ' hrs' },
    { label: 'Dual received', val: fmt(s.dual_received) + ' hrs' },
    { label: 'Night', val: fmt(s.night) + ' hrs' },
    { label: 'Cross-country', val: fmt(s.xc) + ' hrs' },
    { label: 'Actual IMC', val: fmt(s.actual_ifr) + ' hrs' },
    { label: 'Simulated IMC', val: fmt(s.sim_ifr) + ' hrs' },
    { label: 'Solo', val: fmt(s.solo) + ' hrs' },
    { label: 'Day landings', val: s.day_land.toLocaleString() },
    { label: 'Night landings', val: s.night_land.toLocaleString() },
  ];
  document.getElementById('breakdownGrid').innerHTML = breakdown.map(b =>
    `<div class="breakdown-row"><span class="breakdown-label">${b.label}</span><span class="breakdown-val">${b.val}</span></div>`
  ).join('');

  // PACE
  const months60 = monthVals.filter(v => v >= 60).length;
  const paceData = [
    { label: 'Last 12-mo avg', val: fmt(avg12) + ' hrs/mo' },
    { label: 'All-time avg', val: fmt(avgAll) + ' hrs/mo' },
    { label: 'Best month', val: fmt(bestVal) + ' hrs', sub: bestKey },
    { label: 'Months ≥ 60 hrs', val: months60 + ' months', sub: `${((months60/monthVals.length)*100).toFixed(0)}% of months` },
    { label: 'Projected year-end', val: projTotal > 1500 ? '1,500+' : fmt(projTotal) + ' hrs', sub: 'at current pace' },
    { label: 'Months left (2026)', val: monthsLeft + ' months', sub: 'to Dec 31' },
  ];
  document.getElementById('paceRow').innerHTML = paceData.map(d =>
    `<div class="stat-tile">
      <div class="stat-label">${d.label}</div>
      <div class="stat-val" style="font-size:18px">${d.val}</div>
      ${d.sub ? `<div class="stat-sub">${d.sub}</div>` : ''}
    </div>`
  ).join('');

  // YEARLY CHART
  const yrKeys = Object.keys(yearly).sort();
  const yrVals = yrKeys.map(k => yearly[k]);
  if (yearlyChartInst) yearlyChartInst.destroy();
  yearlyChartInst = new Chart(document.getElementById('yearlyChart'), {
    type: 'bar',
    data: {
      labels: yrKeys,
      datasets: [{
        data: yrVals,
        backgroundColor: '#3b82f6',
        borderRadius: { topLeft: 4, topRight: 4 },
        borderSkipped: 'bottom',
        categoryPercentage: 0.5
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${ctx.parsed.y.toFixed(1)} hrs` } } },
      scales: {
        x: { ticks: { color: '#475569', font: { size: 12 } }, grid: { display: false }, border: { color: 'rgba(255,255,255,0.07)' } },
        y: { ticks: { color: '#475569', callback: v => v + 'h' }, grid: { color: 'rgba(255,255,255,0.05)' }, border: { display: false }, min: 0 }
      }
    }
  });

  // AIRCRAFT TABLE
  const topAC = Object.entries(aircraft).sort((a,b) => b[1]-a[1]).slice(0, 12);
  const maxAC = topAC[0]?.[1] || 1;
  const tbody = document.getElementById('aircraftTable').querySelector('tbody');
  tbody.innerHTML = topAC.map(([id, hrs]) =>
    `<tr>
      <td>${id}<span class="ac-bar" style="width:${(hrs/maxAC*80).toFixed(0)}px"></span></td>
      <td>${fmt(hrs)} hrs</td>
    </tr>`
  ).join('');
}

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const rows = parseCSV(e.target.result);
      const stats = computeStats(rows);
      renderDashboard(stats);
      document.getElementById('uploadLabel').textContent = file.name;
    } catch(err) {
      alert('Could not parse file: ' + err.message);
    }
  };
  reader.readAsText(file);
}

document.getElementById('fileInput').addEventListener('change', e => {
  handleFile(e.target.files[0]);
});

// Drag and drop
const dropZone = document.getElementById('dropZone');
document.body.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
document.body.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
document.body.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  handleFile(e.dataTransfer.files[0]);
});

// All data is processed in-memory only. Nothing is stored or transmitted.
</script>
</body>
</html>
